{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="card formulario-estreito mx-auto">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Criar conta</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" id="nome" name="nome" value="{{ nome or '' }}" maxlength="100" autocomplete="name" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" maxlength="100" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" type="password" id="senha" name="senha" minlength="8" maxlength="128" autocomplete="new-password" required>
        <div class="form-text">Use pelo menos 8 caracteres.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirmacao">Confirme a senha</label>
        <input class="form-control" type="password" id="confirmacao" name="confirmacao" minlength="8" maxlength="128" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Criar conta</button>
    </form>
    <p class="mt-3 mb-0 text-center">Já tem conta? <a href="{{ url_for('auth.login') }}">Entre</a></p>
  </div>
</div>
{% endblock %}
