{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card formulario-estreito mx-auto">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Entrar</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" maxlength="100" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control" type="password" id="senha" name="senha" maxlength="128" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <p class="mt-3 mb-0 text-center">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
