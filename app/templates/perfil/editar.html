{% extends "base.html" %}
{% block titulo %}Meu perfil{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Meu perfil</h1>
<div class="row g-3">
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Dados pessoais</h2>
        <form method="post" action="{{ url_for('perfil.editar') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="nome">Nome</label>
            <input class="form-control" id="nome" name="nome" value="{{ nome }}" maxlength="100" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ email }}" maxlength="100" autocomplete="username" required>
          </div>
          <button class="btn btn-primary" type="submit">Salvar dados</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Trocar senha</h2>
        <form method="post" action="{{ url_for('perfil.trocar_senha') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="senha_atual">Senha atual</label>
            <input class="form-control" type="password" id="senha_atual" name="senha_atual" maxlength="128" autocomplete="current-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nova_senha">Nova senha</label>
            <input class="form-control" type="password" id="nova_senha" name="nova_senha" minlength="8" maxlength="128" autocomplete="new-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirmacao">Confirme a nova senha</label>
            <input class="form-control" type="password" id="confirmacao" name="confirmacao" minlength="8" maxlength="128" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary" type="submit">Trocar senha</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
